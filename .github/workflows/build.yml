name: Build StreamHub Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # অ্যান্ড্রয়েড এসডিকে এবং বিল্ড টুলস সরাসরি টার্মিনাল কমান্ড দিয়ে ইনস্টল করার পদ্ধতি (শতভাগ নির্ভরযোগ্য)
      - name: Install Android SDK & Build Tools
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename Output APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/StreamHub.apk || true

      - name: Upload StreamHub APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-Android-APK
          path: app/build/outputs/apk/debug/StreamHub.apk
          if-no-files-found: ignore
