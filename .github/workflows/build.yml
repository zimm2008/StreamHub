name: Build StreamHub Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # অ্যান্ড্রয়েড এসডিকে পাথ এবং লাইসেন্স অটোমেটিক সেটআপ করা
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # গ্রেডেল ও বিল্ড টুলস সঠিকভাবে নামিয়ে কম্পাইল করার এনভায়রনমেন্ট রেডি করা
      - name: Build Debug APK with Gradle
        env:
          ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}
        run: |
          # প্রয়োজনীয় প্ল্যাটফর্ম ও বিল্ড টুলস নিশ্চিত করা
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} "platforms;android-34" "build-tools;34.0.0"
          
          # গ্রেডেল দিয়ে প্রোজেক্ট কম্পাইল করা
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Rename Output APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/StreamHub.apk || true

      - name: Upload StreamHub APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-Android-APK
          path: app/build/outputs/apk/debug/StreamHub.apk
          if-no-files-found: ignore
