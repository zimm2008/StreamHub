name: Build StreamHub Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # অফিশিয়াল অ্যান্ড্রয়েড এসডিকে সেটআপ (এটি sdkmanager এবং সব পাথ অটোমেটিক ঠিক করে দেবে)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # এসডিকে টুলস ইনস্টল করে সরাসরি এপিকে বিল্ড করা
      - name: Build APK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          gradle assembleDebug --no-daemon

      - name: Rename Output APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/StreamHub.apk || true

      - name: Upload StreamHub APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-Android-APK
          path: app/build/outputs/apk/debug/StreamHub.apk
          if-no-files-found: ignore
