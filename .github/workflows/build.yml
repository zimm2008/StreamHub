name: Build StreamHub Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ম্যাজিক স্টেপ: সার্ভারেই অটোমেটিক Gradle Wrapper তৈরি করে নেওয়া হবে (আপনার পিসিতে বানাতে হবে না)
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      # Android SDK এর লাইসেন্সগুলো এক্সেপ্ট করা (যাতে বিল্ড আটকে না যায়)
      - name: Accept Android SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # সরাসরি ডিবাগ এপিকে বিল্ড করা
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # আউটপুট APK ফাইলটি ডাউনলোডের জন্য রেডি করা
      - name: Upload StreamHub APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
