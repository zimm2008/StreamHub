name: Build StreamHub Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # গ্রেডেল প্লাগইন দিয়ে সরাসরি প্রোজেক্ট সেটআপ ও ডিপেন্ডেন্সি ক্যাশ করা
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # অ্যান্ড্রয়েড এসডিকে লাইসেন্স স্বয়ংক্রিয়ভাবে গ্রহণ করে ডিবাগ এপিকে বিল্ড করা
      - name: Build APK with Android SDK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT
          
          # বিল্ড করার জন্য প্রয়োজনীয় কমানো কমান্ড
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          
          # গ্রেডেল বিল্ড রান করা
          gradle assembleDebug --no-daemon

      - name: Rename Output APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/StreamHub.apk || true

      - name: Upload StreamHub APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamHub-Android-APK
          path: app/build/outputs/apk/debug/StreamHub.apk
          if-no-files-found: ignore
